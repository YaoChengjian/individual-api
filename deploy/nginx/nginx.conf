events {
    worker_connections 1024;  # 调整为合适的值
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志配置
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    server {

        listen 80;
        gzip on;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_comp_level 5;
        gzip_types application/octet-stream;
        gzip_static on;
        gzip_http_version 1.1;

        rewrite_log             on;
        charset                 utf-8;

        client_max_body_size    2048m;

        location /static {
            proxy_redirect      off;
            # 确保这个路径正确指静态文件，即是nginx容器存放的静态路径，以nginx容器里面的路径为主
            alias /static;
            access_log          off;
            add_header  Cache-Control   no-store;
            add_header  Content-Length $content_length;
            gzip                off;

        }

        location / {
            proxy_pass         http://fishery-api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # 访问 /admin 强制跳转到 /admin/
        location = /admin {
                return 301 /admin/;
            }

        # 前端 Vue 项目挂载在 /admin/
        location /admin/ {
            alias /usr/share/nginx/html/admin/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /portal/ {
            alias /usr/share/nginx/html/portal/dist/;  # 确保这个路径正确指向前端文件
            try_files $uri $uri/ /portal/index.html;
        }

        location /portal {
            try_files $uri /portal/index.html;
        }
    }
}

