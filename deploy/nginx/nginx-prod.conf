events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # 启用 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml application/octet-stream image/svg+xml;
    gzip_static on;
    gzip_http_version 1.1;


    # ==========  80 端口强制跳转 https  ==========
    #    server {
    #        listen 80;
    #        server_name marinedata.cn www.marinedata.cn;
    #        return 301 https://$host$request_uri;
    #    }


    # ===============================
    # 端口 443：后端 API 代理 + Portal
    # ===============================
    server {
        listen 443 ssl http2;
	server_name marinedata.cn www.marinedata.cn;
        charset utf-8;
        client_max_body_size 2048m;

        ssl_certificate /etc/nginx/ssl/marinedata.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/marinedata.cn.key;

	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_ciphers         HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers on;

        # ----------------------
        # 静态资源 /static
        # ----------------------
        location /static {
            alias /static;
            access_log off;
            add_header Cache-Control no-store;
            add_header Content-Length $content_length;
            gzip off;
        }

    # ----------------------------------------------------
    # 1. 强制把根路径跳转到 /portal#/
    # ----------------------------------------------------
    	location = / {
        	return 301 https://$host/portal#/;
    	}

        # ----------------------
        # 后端 API 代理
        # ----------------------
        location / {
            proxy_pass http://fishery-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # ----------------------
        # 强制访问 /admin 时跳转到带 /
        # ----------------------
        location = /admin {
            return 301 http://$host:50080/admin/;
        }

        # ----------------------
        # Portal 前端项目
        # ----------------------
        location /portal/ {
            alias /usr/share/nginx/html/portal/dist/;
            index index.html;
            try_files $uri $uri/ /portal/index.html;
        }

        location /portal {
            try_files $uri /portal/index.html;
        }
    }

    # ==================================
    # 端口 50080：Admin 前端项目服务
    # ==================================
    server {
        listen 50080;
        charset utf-8;
        client_max_body_size 2048m;

        # 默认根路径
        root /usr/share/nginx/html/admin/dist;
        index index.html;

        # =====================================================
        # ✅ 修复关键问题：/admin/assets/ 静态资源 404
        # =====================================================
        location /admin/assets/ {
            alias /usr/share/nginx/html/admin/dist/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

    # ✅ 后端 API 代理（验证码接口会走这里）
    location /api/ {
        proxy_pass http://fishery-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }


        # =====================================================
        # Vue 前端路由回退
        # =====================================================
        location /admin/ {
            alias /usr/share/nginx/html/admin/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # ----------------------
        # 静态资源 /static
        # ----------------------
        location /static {
            alias /static;
            access_log off;
            add_header Cache-Control no-store;
            add_header Content-Length $content_length;
            gzip off;
        }


        # =====================================================
        # 根路径访问重定向到 /admin/
        # =====================================================
        location / {
            return 301 /admin/;


        }
    }
}
